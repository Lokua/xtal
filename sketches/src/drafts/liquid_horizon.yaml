# ------------------------------------------------------------------------------
#  Flow
# ------------------------------------------------------------------------------

flow_direction:
  var: ex
  type: select
  default: north
  options:
    - north
    - north_east
    - east
    - south_east
    - south
    - south_west
    - west
    - north_west

flow_speed:
  var: aw
  type: slider
  range: [0.0, 0.25]
  default: 0.0125
  step: 0.0125

noise_scale:
  var: bx
  type: slider
  range: [0.5, 8.0]
  default: 3.1
  step: 0.05

amplitude:
  var: by
  type: slider
  range: [0.0, 3.0]
  default: 1.4
  step: 0.05

warp:
  var: cy
  type: random_slewed
  beats: 1.0
  # range: [0.55, 1.35]
  range: [0, 2]
  slew: 0.8

# ------------------------------------------------------------------------------
#  Contours
# ------------------------------------------------------------------------------

contours:
  type: separator

rings:
  var: bz
  type: slider
  range: [0.0, 60.0]
  default: 12.0
  step: 0.25

attract:
  var: cx
  type: slider
  range: [0.0, 1.0]
  default: 0.18
  step: 0.01

refraction:
  var: cz
  type: slider
  range: [0.0, 0.5]
  default: 0.12
  step: 0.005

zoom:
  var: dw
  type: slider
  range: [0.35, 2.5]
  default: 1.0
  step: 0.05

# ------------------------------------------------------------------------------
#  Color + Light
# ------------------------------------------------------------------------------

color_light:
  type: separator

color_mix:
  var: bw
  type: slider
  range: [0.0, 1.0]
  default: 0.9
  step: 0.01

hue:
  var: dx
  type: slider
  range: [0.0, 1.0]
  default: 0.56
  step: 0.01

saturation:
  var: dy
  type: slider
  range: [0.0, 1.0]
  default: 0.85
  step: 0.01

contrast:
  var: dz
  type: slider
  range: [0.5, 2.5]
  default: 1.35
  step: 0.05

specular:
  var: cw
  type: slider
  range: [0.0, 3.0]
  default: 1.2
  step: 0.05

light_angle:
  var: ez
  type: triangle
  beats: 32.0
  range: [0.0, 1.0]

edge_glow:
  var: ew
  type: slider
  range: [0.0, 2.0]
  default: 0.65
  step: 0.05
