# ------------------------------------------------------------------------------
#  Flow
# ------------------------------------------------------------------------------

flow_direction:
  var: ex
  type: select
  default: north
  options:
    - north
    - north_east
    - east
    - south_east
    - south
    - south_west
    - west
    - north_west

flow_speed:
  var: aw
  type: slider
  range: [0.0, 0.25]
  default: 0.0125
  step: 0.0125

noise_scale:
  var: bx
  type: slider
  range: [0.01, 8.0]
  default: 3.1
  # step: 0.01

amplitude:
  var: by
  type: slider
  range: [0.0, 3.0]
  default: 1.4
  step: 0.05

warp_beats:
  type: slider
  range: [1, 4]
  default: 1
  step: 1

warp_range:
  type: slider
  range: [0.0, 3.0]
  default: 2.0
  step: 0.05

warp_offset:
  type: slider
  range: [0, 3.0]
  default: 0.0
  step: 0.05

warp:
  var: cy
  type: triangle
  beats: $warp_beats
  range: [0.0, 1.0]

warp_scale:
  type: effect
  kind: math
  operator: mult
  operand: $warp_range

warp_shift:
  type: effect
  kind: math
  operator: add
  operand: $warp_offset

warp_mod:
  type: mod
  source: warp
  modulators:
    - warp_scale
    - warp_shift

disturbance_probe:
  var: gz
  type: checkbox
  default: false

disturbance_amount:
  var: fy
  type: slider
  range: [0.0, 2.0]
  default: 0.45
  step: 0.05

disturbance_scale:
  var: fz
  type: slider
  range: [0.25, 8.0]
  default: 2.0
  step: 0.25

disturbance_radius:
  var: fw
  type: slider
  range: [0.05, 2.0]
  default: 0.55
  step: 0.05

disturbance_x:
  var: gx
  type: random_slewed
  beats: 4.0
  range: [-0.45, 0.45]
  slew: 0.7

disturbance_y:
  var: gy
  type: random_slewed
  beats: 3.0
  range: [-0.45, 0.45]
  slew: 0.7

# ------------------------------------------------------------------------------
#  Contours
# ------------------------------------------------------------------------------

contours:
  type: separator

rings:
  var: bz
  type: slider
  range: [0.0, 60.0]
  default: 12.0
  step: 0.25

attract:
  var: cx
  type: slider
  range: [0.0, 1.0]
  default: 0.18
  step: 0.01

refraction:
  var: cz
  type: slider
  range: [0.0, 0.5]
  default: 0.12
  step: 0.005

zoom:
  var: dw
  type: slider
  range: [0.35, 2.5]
  default: 1.0
  step: 0.05

# ------------------------------------------------------------------------------
#  Color + Light
# ------------------------------------------------------------------------------

color_light:
  type: separator

color_mix:
  var: bw
  type: slider
  range: [0.0, 1.0]
  default: 0.9
  step: 0.01

auto_hue:
  var: ey
  type: checkbox
  default: false

hue:
  var: dx
  type: slider
  range: [0.0, 1.0]
  default: 0.56
  step: 0.01
  disabled: auto_hue

hue_animation:
  var: fx
  type: triangle
  beats: 64.0
  range: [0.0, 1.0]

saturation:
  var: dy
  type: slider
  range: [0.0, 1.0]
  default: 0.85
  step: 0.01

contrast:
  var: dz
  type: slider
  range: [0.5, 2.5]
  default: 1.35
  step: 0.05

specular:
  var: cw
  type: slider
  range: [0.0, 3.0]
  default: 1.2
  step: 0.05

light_angle:
  var: ez
  type: triangle
  beats: 32.0
  range: [0.0, 1.0]

edge_glow:
  var: ew
  type: slider
  range: [0.0, 2.0]
  default: 0.65
  step: 0.05
